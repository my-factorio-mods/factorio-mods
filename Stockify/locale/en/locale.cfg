[mod-name]
Stockify=Stockify

[mod-description]
Stockify=Press a key to refill your locked inventory slots from nearby chests.

[controls]
stockify-restock=Restock locked slots from nearby chests

[mod-setting-name]
stockify-range=Restock range
stockify-logistic-active-provider=Take from active provider chests
stockify-logistic-passive-provider=Take from passive provider chests
stockify-logistic-storage=Take from storage chests
stockify-logistic-buffer=Take from buffer chests
stockify-logistic-requester=Take from requester chests
stockify-landing-pads=Take from cargo landing pads
stockify-vehicles=Take from car, tank, and spidertron trunks
stockify-cargo-wagons=Take from cargo wagons

[mod-setting-description]
stockify-range=How many tiles around you to look for chests. 10 matches normal reach.
stockify-logistic-active-provider=Also take items from active provider chests.
stockify-logistic-passive-provider=Also take items from passive provider chests.
stockify-logistic-storage=Also take items from storage chests.
stockify-logistic-buffer=Also take items from buffer chests. Careful: these are usually holding items for something else.
stockify-logistic-requester=Also take items from requester chests. Careful: these are usually holding items for something else.
stockify-landing-pads=Also take items from cargo landing pads (Space Age).
stockify-vehicles=Also take items from the trunks of nearby cars, tanks, and spidertrons.
stockify-cargo-wagons=Also take items from cargo wagons. Careful: this can take cargo meant for a train delivery.
