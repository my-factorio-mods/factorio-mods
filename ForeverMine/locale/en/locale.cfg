[mod-name]
ForeverMine=ForeverMine

[mod-description]
ForeverMine=Every ore patch and fluid field can be infinite. Turn infinite on or off per resource and set its yield % (100 = vanilla speed). Not compatible with other infinite resource mods. Thumbnail image is AI-generated.

