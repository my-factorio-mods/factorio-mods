[mod-name]
Sortify=Sortify

[mod-description]
Sortify=Keeps chests sorted and stacks merged while you have them open.

[mod-setting-name]
sortify-enabled=Keep open chests sorted
sortify-cargo-wagons=Also sort cargo wagons
sortify-vehicles=Also sort car, tank, and spidertron trunks
sortify-space-age=Also sort platform hubs and landing pads

[mod-setting-description]
sortify-enabled=Turns Sortify on or off for you. When off, nothing gets sorted.
sortify-cargo-wagons=Sort a cargo wagon's contents when you open it.
sortify-vehicles=Sort the trunk of a car, tank, or spidertron when you open it.
sortify-space-age=Sort space platform hubs and cargo landing pads when you open them (Space Age).
