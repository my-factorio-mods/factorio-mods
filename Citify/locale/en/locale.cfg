[mod-name]
Citify=Citify

[mod-description]
Citify=Turns power poles into streetlights. Each pole softly lights its own supply area, grows with quality, and goes dark when its power does.

[mod-setting-name]
citify-brightness=Brightness
citify-color=Light color
citify-powered-only=Only light when powered
citify-glow-size=Glow size (%)

[mod-setting-description]
citify-brightness=How bright the pole lights are, from 0.1 to 1.
citify-color=Warm and sodium orange give the classic streetlight look.
citify-powered-only=Pole lights turn off when no power has flowed through their network for a few seconds, like a blackout.
citify-glow-size=Fine-tune how far the glow reaches. 100 means it ends at the edge of the pole's supply area.

[string-mod-setting]
citify-color-warm=Warm
citify-color-sodium=Sodium orange
citify-color-white=White
citify-color-cool=Cool
