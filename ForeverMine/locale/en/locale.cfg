[mod-setting-description]
forever-mine-infinite-iron-ore=Checked: never runs out. Unchecked: vanilla (finite, yield setting ignored). Needs a restart.
forever-mine-yield-iron-ore=100 = normal drill speed. 200 = twice as fast, 50 = half speed. Only used if infinite is checked.
forever-mine-infinite-copper-ore=Checked: never runs out. Unchecked: vanilla (finite, yield setting ignored). Needs a restart.
forever-mine-yield-copper-ore=100 = normal drill speed. 200 = twice as fast, 50 = half speed. Only used if infinite is checked.
forever-mine-infinite-coal=Checked: never runs out. Unchecked: vanilla (finite, yield setting ignored). Needs a restart.
forever-mine-yield-coal=100 = normal drill speed. 200 = twice as fast, 50 = half speed. Only used if infinite is checked.
forever-mine-infinite-stone=Checked: never runs out. Unchecked: vanilla (finite, yield setting ignored). Needs a restart.
forever-mine-yield-stone=100 = normal drill speed. 200 = twice as fast, 50 = half speed. Only used if infinite is checked.
forever-mine-infinite-uranium-ore=Checked: never runs out. Unchecked: vanilla (finite, yield setting ignored). Needs a restart.
forever-mine-yield-uranium-ore=100 = normal drill speed. 200 = twice as fast, 50 = half speed. Only used if infinite is checked.
forever-mine-infinite-tungsten-ore=Checked: never runs out. Unchecked: vanilla (finite, yield setting ignored). Needs a restart.
forever-mine-yield-tungsten-ore=100 = normal drill speed. 200 = twice as fast, 50 = half speed. Only used if infinite is checked.
forever-mine-infinite-calcite=Checked: never runs out. Unchecked: vanilla (finite, yield setting ignored). Needs a restart.
forever-mine-yield-calcite=100 = normal drill speed. 200 = twice as fast, 50 = half speed. Only used if infinite is checked.
forever-mine-infinite-scrap=Checked: never runs out. Unchecked: vanilla (finite, yield setting ignored). Needs a restart.
forever-mine-yield-scrap=100 = normal drill speed. 200 = twice as fast, 50 = half speed. Only used if infinite is checked.
forever-mine-infinite-other=For ores added by other mods. Checked: never runs out. Unchecked: vanilla. Needs a restart.
forever-mine-yield-other=For ores added by other mods. 100 = normal drill speed. Only used if infinite is checked.
forever-mine-infinite-crude-oil=Checked: fields never deplete. Unchecked: vanilla (slowly depletes, yield setting ignored). Needs a restart.
forever-mine-yield-crude-oil=Percent of each field's own starting yield. 100 = vanilla, 200 = double, 50 = half. Values below the vanilla minimum get raised to it. Only used if infinite is checked.
forever-mine-infinite-sulfuric-acid-geyser=Checked: fields never deplete. Unchecked: vanilla (slowly depletes, yield setting ignored). Needs a restart.
forever-mine-yield-sulfuric-acid-geyser=Percent of each field's own starting yield. 100 = vanilla, 200 = double, 50 = half. Values below the vanilla minimum get raised to it. Only used if infinite is checked.
forever-mine-infinite-lithium-brine=Checked: fields never deplete. Unchecked: vanilla (slowly depletes, yield setting ignored). Needs a restart.
forever-mine-yield-lithium-brine=Percent of each field's own starting yield. 100 = vanilla, 200 = double, 50 = half. Values below the vanilla minimum get raised to it. Only used if infinite is checked.
forever-mine-infinite-fluorine-vent=Checked: fields never deplete. Unchecked: vanilla (slowly depletes, yield setting ignored). Needs a restart.
forever-mine-yield-fluorine-vent=Percent of each field's own starting yield. 100 = vanilla, 200 = double, 50 = half. Values below the vanilla minimum get raised to it. Only used if infinite is checked.
