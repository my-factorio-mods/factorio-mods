[mod-name]
Stashify=Stashify

[mod-description]
Stashify=Press a key to move items from your inventory into nearby chests that already contain the same item.

[controls]
stashify-quick-stack=Stash items into nearby chests

[mod-setting-name]
stashify-range=Stash range
stashify-logistic-active-provider=Include active provider chests
stashify-logistic-passive-provider=Include passive provider chests
stashify-logistic-storage=Include storage chests
stashify-logistic-buffer=Include buffer chests
stashify-logistic-requester=Include requester chests

[mod-setting-description]
stashify-range=How many tiles around you to look for chests. 10 matches normal reach.
stashify-logistic-active-provider=Also stash into active provider chests. Bots will quickly move the items out into storage.
stashify-logistic-passive-provider=Also stash into passive provider chests.
stashify-logistic-storage=Also stash into storage chests.
stashify-logistic-buffer=Also stash into buffer chests.
stashify-logistic-requester=Also stash into requester chests. Careful: items put here stay until you take them out.
