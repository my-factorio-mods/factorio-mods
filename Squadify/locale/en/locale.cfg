[mod-name]
Squadify=Squadify

[mod-description]
Squadify=Automatically deploys your combat robot capsules up to the caps you choose.

[controls]
squadify-toggle=Toggle auto-deploy of combat robots

[mod-setting-name]
squadify-enabled=Auto-deploy combat robots
squadify-only-near-enemies=Only deploy near enemies
squadify-range=Enemy range
squadify-cap-destroyer=Destroyer cap
squadify-cap-defender=Defender cap
squadify-cap-distractor=Distractor cap

[mod-setting-description]
squadify-enabled=Turn auto-deploy on or off. The hotkey (Ctrl + Shift + G by default) flips this too.
squadify-only-near-enemies=Only deploy when an enemy is within range. Turn off to keep your robots topped up at all times.
squadify-range=How close (in tiles) an enemy has to be before robots are deployed.
squadify-cap-destroyer=How many destroyers to keep following you. 0 means never use destroyer capsules. Each capsule makes 5, so a capsule is only used when all 5 fit.
squadify-cap-defender=How many defenders to keep following you. 0 means never use defender capsules.
squadify-cap-distractor=How many distractors to keep following you. 0 means never use distractor capsules. Each capsule makes 3, so a capsule is only used when all 3 fit.
